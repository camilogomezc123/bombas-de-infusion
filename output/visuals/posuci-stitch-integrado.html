  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function caregiverScreen(){return '<section class="si-caregiver-hero"><span class="si-avatar">MG</span><div><div class="si-kicker">Acompañamiento integral</div><h1>Hola, María</h1><p class="si-muted">Cuidadora principal de '+patient.name+'</p></div></section><div class="si-caregiver-grid" style="margin-top:18px"><div class="si-stack"><section class="si-panel"><div class="si-panel-head"><div><div class="si-kicker">Tu bienestar también importa</div><h2>Nivel de energía y tensión acumulada</h2></div>'+chip('Bajo control','teal')+'</div>'+progress(28,100,'Carga del cuidador')+'<div class="si-mood-grid">'+[['Reparador','🌿'],['Con cansancio','😪'],['Abrumada','🌧️']].map(m=>'<button type="button" class="si-mood"><span>'+m[1]+'</span><strong>'+m[0]+'</strong></button>').join('')+'</div></section><section class="si-panel"><div class="si-panel-head"><h2>Parte de '+patient.first+'</h2>'+chip('Actualizado 09:30','teal')+'</div><div class="si-family-strip"><span class="si-logo-mark">'+ico('bed')+'</span><div><strong>Seguimiento en casa</strong><small class="si-muted">Evolución estable · datos de ejemplo</small></div>'+chip(patient.wellbeing,'teal')+'</div><p style="margin-top:14px">El plan de hoy lleva <strong>'+completed()+' de '+patient.tasks.length+'</strong> actividades registradas.</p></section><section class="si-panel"><h2>Caja de herramientas</h2><div class="si-content-grid" style="margin-top:14px"><article class="si-content"><div class="si-content-body"><strong>Manejo del delirium post-UCI</strong><p class="si-small si-muted">Guía rápida para acompañar con seguridad.</p>'+btn('Abrir guía','open-family-guide','','soft')+'</div></article><article class="si-content"><div class="si-content-body"><strong>Autocuidado familiar</strong><p class="si-small si-muted">Pausas, relevos y señales de sobrecarga.</p>'+btn('Ver tema','open-family-guide','','soft')+'</div></article></div></section></div><div class="si-stack"><section class="si-panel"><h2>Círculo de cuidado</h2><div class="si-care-circle" style="margin-top:14px">'+[['MG','María','Cuidadora principal · Turno activo'],['JG','Jorge','Hijo · Relevo tarde'],['LG','Laura','Hermana · Apoyo fin de semana']].map((m,i)=>'<div class="si-care-member"><span class="si-avatar" style="width:36px;height:36px;font-size:11px">'+m[0]+'</span><div><strong>'+m[1]+'</strong><small class="si-muted">'+m[2]+'</small></div>'+(i===0?chip('Activo','teal'):'')+'</div>').join('')+'</div></section><section class="si-panel" style="background:var(--si-primary);color:#fff"><div class="si-kicker" style="color:#bffff6">Línea humana directa</div><h2>Trabajo social y psicología familiar</h2><p style="margin-top:8px">Orientación en dudas emocionales, trámites y continuidad del cuidado.</p><div style="margin-top:14px">'+btn('Solicitar orientación','support','','')+'</div></section></div></div>';}
  function profileTabs(){const tabs=[['summary','Resumen'],['clinical','Clínico'],['family','Familia y cuidadores'],['communication','Comunicación y educación'],['consents','Consentimientos'],['continuity','Seguimiento']];return '<nav class="si-profile-tabs" aria-label="Secciones del perfil">'+tabs.map(t=>'<button type="button" data-profile="'+t[0]+'" aria-pressed="'+(state.profileTab===t[0])+'">'+t[1]+'</button>').join('')+'</nav>';}

  if(state.profileTab==='clinical')body='<div class="si-cols-3"><section class="si-panel"><h2>Antecedentes y diagnósticos</h2><p style="margin-top:12px">Antecedentes relevantes del caso y diagnósticos activos.</p><div class="si-alert" style="margin-top:14px">Contenido clínico de demostración, sin conexión a historia real.</div></section><section class="si-panel"><h2>Medicamentos clave</h2><div class="si-data-list" style="margin-top:14px">'+data('Conciliación','Al día')+data('Última revisión','Hoy · demo')+'</div></section><section class="si-panel"><h2>Escalas y controles</h2><div class="si-data-list" style="margin-top:14px">'+data('Movilidad','Marcha asistida')+data('Prioridad','Revisión interdisciplinaria')+'</div></section></div>';

  function clinicalHeader(){return '<header class="si-clinical-head"><div class="si-flex si-between"><div><div class="si-kicker" style="color:#8ef6e8">Unidad post-UCI</div><h1>Estación médica PICS · Nivel 3</h1><p class="si-muted">Programa de prevención y rehabilitación post cuidado intensivo</p></div>'+chip('Sin conexión a datos reales','amber')+'</div></header>';}
  function patientBanner(){return '<section class="si-patient-banner"><div class="si-person"><span class="si-avatar">'+patient.initials+'</span><div><div class="si-flex"><h1>'+patient.name+'</h1>'+chip(patient.age+' años')+chip(patient.case,'teal')+'</div><p style="margin-top:6px">'+patient.diagnosis+'</p><p class="si-muted">'+patient.stage+' · Resp. Dra. Andrea Morales / Lic. Laura Gómez</p></div></div><div class="si-metric"><span class="si-kicker">Bienestar subjetivo</span><strong>'+patient.wellbeing+' '+(patient.wellbeing==='Bien'?'😊':patient.wellbeing==='Regular'?'😐':'😔')+'</strong><span class="si-small si-muted">Reportado desde el portal · ahora</span><div style="margin-top:10px">'+progress(completed(),patient.tasks.length,'Cumplimiento de metas')+'</div></div></section>';}
  function clinicalTabs(){const tabs=[['profile','1. Perfil integral'],['plan','2. Plan y actividades'],['education','3. Educación personalizada'],['followup','4. Seguimiento POSUCI'],['agenda','5. Agenda coordinada']];return '<nav class="si-clinical-tabs" aria-label="Flujo clínico">'+tabs.map(t=>'<button type="button" data-clinical="'+t[0]+'" '+(state.clinicalTab===t[0]?'aria-current="page"':'')+'>'+t[1]+'</button>').join('')+'</nav>';}
  function clinicalProfile(){return profileContent();}
  function clinicalPlan(){return '<div class="si-title"><div><h1>Plan interdisciplinario y actividades</h1><p>Prescripción individualizada y visibilidad en el portal.</p></div>'+btn('Añadir desde la biblioteca','go-education','','primary')+'</div><section class="si-panel"><div class="si-table-wrap"><table class="si-table"><thead><tr><th>Actividad</th><th>Disciplina</th><th>Momento</th><th>Estado portal</th><th>Validación</th></tr></thead><tbody>'+patient.tasks.map(t=>'<tr><td><strong>'+esc(t.title)+'</strong><br><span class="si-muted">'+esc(t.detail)+'</span></td><td>'+esc(t.category)+'</td><td>'+({morning:'Mañana',afternoon:'Tarde',night:'Noche'}[t.period])+'</td><td>'+(t.done?chip('Registrada','teal'):chip('Pendiente','amber'))+'</td><td>'+(t.validated?chip('Validada','teal'):t.done?chip('Por revisar','amber'):'—')+'</td></tr>').join('')+'</tbody></table></div></section>';}
  function clinicalEducation(){const g=guides[state.selectedGuide];const existing=patient.tasks.find(t=>t.guide===state.selectedGuide);return '<div class="si-title"><div><div class="si-kicker">Asignación clínica activa</div><h1>Prescribir guía educativa a '+patient.first+'</h1><p>La vista previa muestra cómo llegará a POSUCI 360.</p></div>'+chip(existing?'Ya asignada':'Lista para asignar',existing?'teal':'amber')+'</div><div class="si-assign-grid"><section class="si-panel"><div class="si-panel-head"><h2>Biblioteca PICS</h2>'+chip('3 guías')+'</div><div class="si-stack">'+Object.entries(guides).map(([id,item])=>'<button type="button" class="si-guide" data-guide="'+id+'" aria-pressed="'+(state.selectedGuide===id)+'"><span class="si-kicker">'+item.category+'</span><strong>'+item.title+'</strong><small>'+item.duration+' · Ficha interactiva</small></button>').join('')+'</div></section><section class="si-panel"><h2>'+g.title+'</h2><p class="si-muted" style="margin-top:7px">'+g.detail+'</p><label class="si-field">Momento del día<select id="si-moment"><option value="morning" '+(state.moment==='morning'?'selected':'')+'>Bloque mañana</option><option value="afternoon" '+(state.moment==='afternoon'?'selected':'')+'>Bloque tarde</option><option value="night" '+(state.moment==='night'?'selected':'')+'>Bloque noche</option></select></label><label class="si-field">Mensaje personalizado<textarea id="si-guide-note">'+patient.first+', realiza esta guía a tu ritmo y con acompañamiento de '+patient.caregiver.name.split(' ')[0]+'.</textarea></label><div class="si-alert" style="margin-top:13px">El contenido queda asociado al plan y conserva autor, versión y responsable.</div><div class="si-flex" style="margin-top:15px">'+btn('Vista previa paciente','preview-assignment')+btn(existing?'Asignada':'Confirmar y enviar','assign-guide','data-id="'+state.selectedGuide+'" '+(existing?'disabled':''),'primary')+'</div></section><section class="si-panel si-assign-preview"><div class="si-panel-head"><h2>Impacto en POSUCI 360</h2>'+chip('Vista en vivo','amber')+'</div><div class="si-preview-task"><div class="si-flex si-between"><span class="si-kicker">'+g.category+'</span>'+chip(({morning:'Mañana',afternoon:'Tarde',night:'Noche'}[state.moment]),'teal')+'</div><h3 style="margin-top:10px">'+g.title+'</h3><p class="si-small si-muted" style="margin-top:6px">'+g.duration+' · con '+patient.caregiver.name.split(' ')[0]+'</p><div style="margin-top:12px">'+btn('Abrir guía','preview-assignment','','soft')+'</div></div><p class="si-small si-muted" style="margin-top:13px">Al confirmar, aparecerá en Tu día, Mis metas y Educación.</p></section></div>';}
  function clinicalFollowup(){const pending=patient.tasks.filter(t=>t.done&&!t.validated);const selected=pending[0]||patient.tasks.find(t=>t.done);return '<div class="si-title"><div><div class="si-kicker">Bandeja de validación interdisciplinaria</div><h1>Seguimiento post-UCI</h1><p>Registros del paciente y cuidador disponibles para revisión.</p></div><div class="si-flex">'+chip(pending.length+' pendientes','amber')+chip(patient.tasks.filter(t=>t.validated).length+' validados','teal')+'</div></div><div class="si-validation"><section class="si-panel"><div class="si-panel-head"><div><span class="si-kicker">Registro seleccionado</span><h2>'+esc(selected.title)+'</h2></div>'+chip(selected.validated?'Validado':'Pendiente de validación',selected.validated?'teal':'amber')+'</div><div class="si-metrics">'+[['Esfuerzo percibido','2 / 10'],['Duración',selected.duration],['Bienestar',patient.wellbeing],['Ejecutado por',patient.first]].map(m=>'<div class="si-metric"><span class="si-small si-muted">'+m[0]+'</span><strong style="font-size:17px">'+m[1]+'</strong></div>').join('')+'</div><div class="si-clinical-note" style="margin-top:14px">“Realicé la actividad con descansos y acompañamiento. Sin mareo en esta demostración.”</div></section><section class="si-panel"><div class="si-panel-head"><h2>Decisión y firma clínica</h2>'+ico('gavel')+'</div><div class="si-alert">Criterios de seguridad: revisión profesional obligatoria.</div><label class="si-field">Devolución para paciente y cuidadora<textarea id="si-feedback">Buena ejecución. Mantén este ritmo y avisa si aparece una molestia nueva.</textarea></label><div style="margin-top:14px">'+btn(selected.validated?'Registro validado':'Validar y enviar devolución','validate-task','data-id="'+selected.id+'" '+(selected.validated?'disabled':''),'primary')+'</div></section></div><section class="si-panel" style="margin-top:16px"><h2>Historial longitudinal</h2><div class="si-table-wrap" style="margin-top:12px"><table class="si-table"><thead><tr><th>Actividad</th><th>Categoría</th><th>Ejecutado por</th><th>Datos reportados</th><th>Estado</th></tr></thead><tbody>'+patient.tasks.filter(t=>t.done).map(t=>'<tr><td>'+esc(t.title)+'</td><td>'+esc(t.category)+'</td><td>'+patient.first+(t.id==='hydration'?' + cuidadora':'')+'</td><td>Registro de demostración · '+esc(t.duration)+'</td><td>'+(t.validated?chip('Validado','teal'):chip('Pendiente','amber'))+'</td></tr>').join('')+'</tbody></table></div></section>';}
  function clinicalAgenda(){return '<div class="si-title"><div><h1>Agenda coordinada</h1><p>Citas, teleconsultas y preparación familiar.</p></div>'+btn('Nueva cita','new-appointment','','primary')+'</div><div class="si-cols-2"><section class="si-panel"><div class="si-panel-head"><h2>Próxima teleconsulta</h2>'+chip('Confirmada','teal')+'</div><div class="si-family-strip"><span class="si-logo-mark">'+ico('video')+'</span><div><strong>14 nov · 09:30</strong><small>Dra. Andrea Morales · Sala ÁGORA 4</small></div>'+btn('Gestionar','new-appointment','','soft')+'</div></section><section class="si-panel"><h2>Preparación de la familia</h2><div class="si-data-list" style="margin-top:13px">'+data('Cuidadora',patient.caregiver.name)+data('Confirmación','Recibida')+data('Guía de preparación','Revisada')+data('Preguntas previas','1 registrada')+'</div></section></div>';}
  function clinicalContent(){if(state.clinicalTab==='profile')return clinicalProfile();if(state.clinicalTab==='plan')return clinicalPlan();if(state.clinicalTab==='education')return clinicalEducation();if(state.clinicalTab==='followup')return clinicalFollowup();return clinicalAgenda();}
  function renderClinical(){clinicalEl.innerHTML=globalHeader('clinical')+'<div class="si-clinical">'+clinicalSidebar()+'<div class="si-clinical-main">'+clinicalHeader()+patientBanner()+clinicalTabs()+'<main class="si-clinical-content">'+clinicalContent()+'</main></div></div><footer class="si-footer"><span>Estación clínica de demostración</span><span>Sin datos reales · Validación profesional obligatoria</span></footer>';}
  function renderTrace(){traceEl.innerHTML=globalHeader('trace')+'<main class="si-main"><div class="si-title"><div><div class="si-kicker">Arquitectura de integración bidireccional</div><h1>Mapa de flujos: ÁGORA ↔ POSUCI 360</h1><p>Siete canales conectan la prescripción clínica con la experiencia del paciente y su familia.</p></div>'+chip('Enlace activo','teal')+'</div><div class="si-metrics">'+[['Canales de enlace','7'],['Estándar clínico','FHIR R4'],['Validación','Profesional'],['Datos inventados','Prohibidos']].map(m=>'<div class="si-metric"><span class="si-small si-muted">'+m[0]+'</span><strong>'+m[1]+'</strong></div>').join('')+'</div><section class="si-panel" style="margin-top:18px"><div class="si-panel-head"><h2>Matriz de conexión bidireccional</h2>'+chip('Selecciona un canal','indigo')+'</div><div class="si-stack">'+channels.map((c,i)=>'<button type="button" class="si-guide" data-channel="'+(i+1)+'" aria-pressed="'+(state.traceChannel===i+1)+'"><div class="si-flow-grid"><div class="si-flow-node"><span class="si-kicker">Panel clínico ÁGORA</span><strong>'+(i+1)+'. '+c[0]+'</strong></div><div class="si-arrow">↔</div><div class="si-flow-node"><span class="si-kicker">Portal POSUCI 360</span><strong>'+(i+1)+'. '+c[1]+'</strong><small>'+c[2]+'</small></div></div></button>').join('')+'</div></section><div class="si-title" style="margin-top:22px"><div><h2>Reglas de oro</h2><p>Protecciones presentes en todos los canales.</p></div></div><div class="si-rules">'+[['1','Separación clínica y gamificación','Puntos y rachas nunca modifican una decisión clínica.'],['2','Validación profesional','Los registros del portal permanecen pendientes hasta revisión.'],['3','Familia con rol explícito','Cada acción identifica si proviene del paciente o cuidador.'],['4','Consentimiento y privacidad','El acceso familiar depende de autorización vigente.'],['5','Sin datos inventados','Las pantallas muestran ausencia de información de forma honesta.'],['6','Trazabilidad completa','Cada cambio conserva autor, fecha, origen y estado.']].map(r=>'<article class="si-rule"><strong>'+r[0]+'. '+r[1]+'</strong><span class="si-small si-muted">'+r[2]+'</span></article>').join('')+'</div></main><footer class="si-footer"><span>Mapa conceptual del prototipo</span><span>Interoperabilidad · Privacidad · Humanización</span></footer>';}
  function announce(message){live.textContent=message;}
  function render(){root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));portalEl.hidden=state.view!=='portal';clinicalEl.hidden=state.view!=='clinical';traceEl.hidden=state.view!=='trace';renderPortal();renderClinical();renderTrace();root.style.setProperty('--si-gap',design.compact?'12px':'18px');root.style.setProperty('--si-radius',design.compact?'16px':'22px');if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.view){state.view=b.dataset.view;render();announce('Vista: '+b.textContent.trim());return;}
    if(b.dataset.portal){state.portalTab=b.dataset.portal;state.actor='patient';render();announce('Portal: '+b.textContent.trim());return;}
    if(b.dataset.clinical){state.clinicalTab=b.dataset.clinical;render();announce('Panel clínico: '+b.textContent.trim());return;}
    if(b.dataset.profile){state.profileTab=b.dataset.profile;render();announce('Perfil: '+b.textContent.trim());return;}
    if(b.dataset.guide){state.selectedGuide=b.dataset.guide;render();return;}
    if(b.dataset.channel){state.traceChannel=Number(b.dataset.channel);render();announce('Canal '+b.dataset.channel+': '+channels[state.traceChannel-1][0]);return;}
    const a=b.dataset.action;if(!a)return;
    if(a==='toggle-actor'){state.actor=state.actor==='patient'?'caregiver':'patient';render();announce(state.actor==='patient'?'Vista del paciente':'Vista de la cuidadora');}
    if(a==='easy-mode'){design.compact=false;root.style.fontSize=root.style.fontSize?'':'17px';announce(root.style.fontSize?'Modo fácil activado':'Modo fácil desactivado');}
    if(a==='mood'){patient.wellbeing=b.dataset.value;const task=patient.tasks.find(t=>t.id==='wellbeing');if(task){task.done=true;task.validated=false;}render();announce('Bienestar registrado: '+patient.wellbeing);}
    if(a==='portal-calendar'){state.portalTab='today';render();announce('La cita está visible en Tu día.');}
    if(a==='support'){state.actor='patient';state.portalTab='support';render();}
    if(a==='go-education'){state.clinicalTab='education';render();}
    if(a==='assign-guide'){const id=b.dataset.id;if(!patient.tasks.some(t=>t.guide===id)){const g=guides[id];patient.tasks.push({id:'guide-'+id,title:g.title,detail:g.detail,period:state.moment,category:g.category,duration:g.duration,done:false,validated:false,feedback:'',guide:id});announce('Guía asignada. Ya aparece en el portal de '+patient.first+'.');}render();}
    if(a==='preview-assignment'){state.view='portal';state.actor='patient';state.portalTab='today';render();announce('Vista previa del plan diario de '+patient.first+'.');}
    if(a==='open-guide'){state.portalTab='education';state.view='portal';state.actor='patient';render();announce('Contenido educativo abierto en modo demostración.');}
    if(a==='validate-task'){const t=patient.tasks.find(x=>x.id===b.dataset.id);if(t){t.validated=true;t.feedback=(root.querySelector('#si-feedback')?.value||'Registro revisado por el equipo.');}render();announce('Registro validado y devolución visible en Mi progreso.');}
    if(a==='open-family-guide'||a==='new-appointment'){announce('Acción simulada. No se ha enviado ni reservado nada.');}
  });
  root.addEventListener('change',event=>{const el=event.target;if(el.dataset.task){const t=patient.tasks.find(x=>x.id===el.dataset.task);t.done=el.checked;t.validated=false;if(!t.done)t.feedback='';render();announce(t.done?'Actividad registrada y enviada a validación.':'Actividad devuelta a pendiente.');}if(el.id==='si-moment'){state.moment=el.value;render();}});
  root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='si-support-form'){patient.message=event.target.elements.message.value.trim();announce('Consulta guardada únicamente en esta demostración.');render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'Densidad clínica compacta'});}
})();
</script>
