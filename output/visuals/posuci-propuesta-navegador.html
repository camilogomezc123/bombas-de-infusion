  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(function(){

  const patients=[

    {id:&#x27;bruno&#x27;,name:&#x27;Bruno&#x27;,initials:&#x27;BR&#x27;,stage:&#x27;Plan por revisar&#x27;,mood:&#x27;Regular&#x27;,tasks:[{id:&#x27;b1&#x27;,wellbeing:true,title:&#x27;Registrar cómo me siento&#x27;,type:&#x27;Bienestar&#x27;,done:true},{id:&#x27;b2&#x27;,title:&#x27;Revisar mi calendario&#x27;,type:&#x27;Acompañamiento&#x27;,done:false}]},
    {id:&#x27;carla&#x27;,name:&#x27;Carla&#x27;,initials:&#x27;CA&#x27;,stage:&#x27;Seguimiento en casa&#x27;,mood:&#x27;&#x27;,tasks:[{id:&#x27;c1&#x27;,wellbeing:true,title:&#x27;Registrar cómo me siento&#x27;,type:&#x27;Bienestar&#x27;,done:false},{id:&#x27;c2&#x27;,title:&#x27;Conocer mi plan de recuperación&#x27;,type:&#x27;Educación · Guía&#x27;,done:false}]}
  ];
  const materials=[

    {id:&#x27;m2&#x27;,title:&#x27;Reconoce cómo te sientes&#x27;,category:&#x27;Bienestar&#x27;,type:&#x27;Registro guiado&#x27;,time:&#x27;2 min&#x27;,icon:&#x27;heart&#x27;,summary:&#x27;Una actividad para registrar tu experiencia del día y compartirla con tu equipo.&#x27;},
    {id:&#x27;m3&#x27;,title:&#x27;Movilidad: guía de tu equipo&#x27;,category:&#x27;Actividad&#x27;,type:&#x27;Guía&#x27;,time:&#x27;Según tu plan&#x27;,icon:&#x27;accessibility&#x27;,summary:&#x27;Material que el profesional adapta al plan individual antes de asignarlo.&#x27;},
    {id:&#x27;m4&#x27;,title:&#x27;Cuidar también es acompañar&#x27;,category:&#x27;Educación&#x27;,type:&#x27;Guía para el cuidador&#x27;,time:&#x27;5 min&#x27;,icon:&#x27;hand-heart&#x27;,summary:&#x27;Temas para conversar sobre acompañamiento, organización y apoyo en casa.&#x27;}

  const appointments=[{id:&#x27;v1&#x27;,person:&#x27;ana&#x27;,date:&#x27;2026-09-22&#x27;,time:&#x27;10:00&#x27;,title:&#x27;Seguimiento con tu equipo&#x27;,status:&#x27;Confirmada&#x27;},{id:&#x27;v2&#x27;,person:&#x27;bruno&#x27;,date:&#x27;2026-09-23&#x27;,time:&#x27;15:30&#x27;,title:&#x27;Revisión del plan&#x27;,status:&#x27;Por confirmar&#x27;}];
  const state={view:&#x27;team&#x27;,page:&#x27;overview&#x27;,mobile:&#x27;home&#x27;,person:&#x27;ana&#x27;,detail:false,filter:&#x27;Todos&#x27;,material:null,reading:null,editing:null};
  const design={accent:&#x27;Verde&#x27;,radius:16,compact:false,achievements:false};
  let serial=0;
  function esc(value){return String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,function(c){return {&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c];});}
  function icon(name){return &#x27;&lt;i data-lucide=&quot;&#x27;+name+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;}
  function current(){return patients.find(function(p){return p.id===state.person;});}
  function count(p){return p.tasks.filter(function(t){return t.done;}).length;}
  function button(label,action,extra,primary){return &#x27;&lt;button type=&quot;button&quot; class=&quot;p-button&#x27;+(primary?&#x27; primary&#x27;:&#x27;&#x27;)+&#x27;&quot; data-action=&quot;&#x27;+action+&#x27;&quot; &#x27;+(extra||&#x27;&#x27;)+&#x27;&gt;&#x27;+label+&#x27;&lt;/button&gt;&#x27;;}
  function badge(label,tone){return &#x27;&lt;span class=&quot;p-label &#x27;+(tone||&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+label+&#x27;&lt;/span&gt;&#x27;;}
  function track(value,total,label){const percent=total?Math.round(value/total*100):0;return &#x27;&lt;div class=&quot;p-track&quot; role=&quot;progressbar&quot; aria-label=&quot;&#x27;+esc(label)+&#x27;&quot; aria-valuenow=&quot;&#x27;+percent+&#x27;&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;&lt;span style=&quot;width:&#x27;+percent+&#x27;%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&#x27;;}
  function title(heading,sub,action){return &#x27;&lt;div class=&quot;p-title&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+heading+&#x27;&lt;/h1&gt;&lt;p&gt;&#x27;+sub+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+(action||&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}
  function announce(message){status.textContent=message;}
  function shortDate(value){return new Intl.DateTimeFormat(&#x27;es-CO&#x27;,{day:&#x27;numeric&#x27;,month:&#x27;short&#x27;}).format(new Date(value+&#x27;T12:00:00&#x27;));}
  function totalDone(){return patients.reduce(function(n,p){return n+count(p);},0);}
  function totalTasks(){return patients.reduce(function(n,p){return n+p.tasks.length;},0);}
  function stat(label,value,detail){return &#x27;&lt;div class=&quot;p-stat&quot;&gt;&lt;span&gt;&#x27;+label+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+value+&#x27;&lt;/strong&gt;&lt;span&gt;&#x27;+detail+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;}
  function appointmentRow(a,action){const month=new Intl.DateTimeFormat(&#x27;es-CO&#x27;,{month:&#x27;short&#x27;}).format(new Date(a.date+&#x27;T12:00:00&#x27;));return &#x27;&lt;div class=&quot;p-row&quot;&gt;&lt;span class=&quot;p-date&quot;&gt;&lt;strong&gt;&#x27;+a.date.slice(-2)+&#x27;&lt;/strong&gt;&#x27;+month+&#x27;&lt;/span&gt;&lt;div class=&quot;p-grow&quot;&gt;&lt;h3&gt;&#x27;+esc(a.title)+&#x27;&lt;/h3&gt;&lt;p&gt;&#x27;+esc(patients.find(function(p){return p.id===a.person;}).name)+&#x27; · &#x27;+a.time+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+(action?button(&#x27;Gestionar&#x27;,&#x27;appointment&#x27;,&#x27;data-id=&quot;&#x27;+a.id+&#x27;&quot;&#x27;):badge(a.status,a.status===&#x27;Confirmada&#x27;?&#x27;good&#x27;:&#x27;pending&#x27;))+&#x27;&lt;/div&gt;&#x27;;}
  function overview(){return title(&#x27;El cuidado, en un solo lugar.&#x27;,&#x27;Una vista clara de lo que necesita atención hoy.&#x27;,badge(&#x27;19 sep 2026 · Demo&#x27;))+
    &#x27;&lt;div class=&quot;p-stats&quot;&gt;&#x27;+stat(&#x27;Personas en seguimiento&#x27;,patients.length,&#x27;Pacientes de ejemplo&#x27;)+stat(&#x27;Plan de hoy&#x27;,totalDone()+&#x27; / &#x27;+totalTasks(),&#x27;Actividades registradas&#x27;)+stat(&#x27;Próximas citas&#x27;,appointments.length,&#x27;Agenda del equipo&#x27;)+&#x27;&lt;/div&gt;&#x27;+

    &#x27;&lt;section class=&quot;p-panel p-topspace&quot;&gt;&lt;div class=&quot;p-flex p-between&quot;&gt;&lt;div&gt;&lt;h2&gt;Del plan a la experiencia del paciente&lt;/h2&gt;&lt;p class=&quot;p-small p-muted&quot;&gt;Selecciona a Ana, asigna una guía y revisa cómo aparece en su día.&lt;/p&gt;&lt;/div&gt;&#x27;+button(&#x27;Explorar el recorrido &#x27;+icon(&#x27;arrow-right&#x27;),&#x27;person&#x27;,&#x27;data-id=&quot;ana&quot;&#x27;,true)+&#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;}
